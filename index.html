<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><meta charset="utf-8">
<title>Sib San Resort Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: a working field map — control rail beside a pannable plan; story pages open full-screen over it */
:root{
  --bg:#f3f1ea; --panel:#fffdf7; --ink:#1f2a27; --muted:#66706b; --line:#dcd7c8;
  --river:#0f6b6f; --teak:#9a5b2c; --route:#e2552d; --from:#0f6b6f; --to:#e2552d; --mapbg:#ffffff; --peek:62px;
  --shade:rgba(31,42,39,.06); --on-river:#ffffff;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2422; --ink:#e9ece6; --muted:#9aa59f; --line:#2f3a37;
  --river:#5fb8b1; --teak:#d39a6a; --route:#ff7a4d; --from:#5fb8b1; --to:#ff7a4d; --mapbg:#e9e7df;
  --shade:rgba(255,255,255,.05); --on-river:#0d1413; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2422; --ink:#e9ece6; --muted:#9aa59f; --line:#2f3a37;
  --river:#5fb8b1; --teak:#d39a6a; --route:#ff7a4d; --from:#5fb8b1; --to:#ff7a4d; --mapbg:#e9e7df;
  --shade:rgba(255,255,255,.05); --on-river:#0d1413; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#root{height:100%}
.app{display:grid;grid-template-columns:370px 1fr;height:100%;min-height:560px}
.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-block:20px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:20px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small,.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teak);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;font-size:15px}
textarea{resize:vertical;line-height:1.5}
label.f input,label.f textarea,label.f select{color:var(--ink)}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:14px;flex:0 0 auto}
.btn.primary{background:var(--river);border-color:var(--river);color:var(--on-river)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--teak);border-color:var(--teak);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.result{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.result .leg{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.big{font-family:var(--f-num);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:15px;color:var(--muted);margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--f-num);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:12px;color:var(--muted);margin:0}
.villa-card[hidden]{display:none}
.villa-card{border-left:3px solid var(--river);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.villa-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.villa-card p{margin:0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.hours{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.hours span:nth-child(even){font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.err{color:var(--route);font-size:13px;margin:0}
/* explore cards */
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer;text-align:left;padding:0}
.card .ph{aspect-ratio:4/3}
.card span{display:block;padding:8px 10px 10px;min-width:0}
.card b{display:block;font-size:13px;line-height:1.25}
.card small{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--f-num)}
.ph{position:relative;width:100%;max-width:100%;overflow:hidden;background:var(--shade);display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .mono{font-family:var(--f-display);font-size:30px;color:var(--teak);opacity:.75}
/* areas */
.areas{display:flex;flex-direction:column;gap:8px}
.area{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.area i{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.area .t{flex:1;min-width:0}
.area b{font-size:14px;display:block}
.area .acts{display:flex;gap:6px;flex:0 0 auto}
/* map */
.mapwrap{position:relative;overflow:hidden;background:var(--mapbg);touch-action:none;min-width:0}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.measuring{cursor:crosshair}
.tools{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:40px;height:40px;border-radius:8px;border:1px solid #cfc9b8;background:#fffdf7;color:#1f2a27;font-size:20px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheetgrab{display:none}
.tools .mebtn{display:grid;place-items:center;color:#5d6762;padding:0}
.tools .mebtn .f{fill:none}
.tools .mebtn[aria-pressed="true"]{color:#1a73e8}
.tools .mebtn[aria-pressed="true"] .f{fill:#1a73e8}
.tools .mebtn.free .f{fill:none}
.mepill{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;max-width:calc(100% - 90px);z-index:2;
  display:flex;align-items:center;gap:8px;background:#fffdf7;color:#1f2a27;border:1px solid #cfc9b8;border-radius:999px;
  padding:7px 13px 7px 10px;font:600 13px/1.3 var(--f-body);box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:pointer;text-align:left}
.mepill i{width:10px;height:10px;border-radius:50%;background:#1a73e8;flex:0 0 10px;box-shadow:0 0 0 3px rgba(26,115,232,.22)}
.mepill span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mepill small{color:#5d6762;font-weight:500;font-family:var(--f-num);font-size:12px;white-space:nowrap}
.mepill.warn{border-radius:12px;white-space:normal;align-items:flex-start;flex-direction:column;gap:6px;cursor:default}
.mepill.warn i{display:none}
.mepill a{color:#0f6b6f;font-weight:700}
body.walking .mepill{display:none}
[dir="rtl"] .mepill{text-align:right}
#langSel{width:auto;min-width:40px;height:40px;border-radius:8px;border:1px solid #cfc9b8;background:#fffdf7;color:#1f2a27;
  font-family:inherit;font-size:13px;font-weight:700;padding:0 4px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center}
#storyLangSel{width:auto;min-width:40px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font-family:inherit;font-size:13px;font-weight:700;padding:0 4px;cursor:pointer;text-align:center;flex:0 0 auto}
[dir="rtl"] .brand,[dir="rtl"] .sec,[dir="rtl"] .villa-card,[dir="rtl"] .result,[dir="rtl"] .facts,[dir="rtl"] .peek .t{text-align:right}
[dir="rtl"] .villa-card{border-left:0;border-right:3px solid var(--river);padding:4px 12px 4px 0}
[dir="rtl"] .tips{padding-left:0;padding-right:18px}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;background:rgba(255,253,247,.94);color:#1f2a27;border:1px solid #cfc9b8;border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 24px)}
.legend .keys{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.peeking .legend{display:none}
.scalebar{display:flex;flex-direction:column;gap:3px}
.scalebar i{display:block;height:6px;border:2px solid #1f2a27;border-top:0}
.scalebar b{font-family:var(--f-num);font-weight:500;font-size:11px}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#1f2a27;color:#fff;padding:7px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.peek{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));
  background:#fffdf7;color:#1f2a27;border:1px solid #cfc9b8;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:12px;padding:10px;align-items:center}
.peek .ph{width:84px;flex:0 0 84px;aspect-ratio:1;border-radius:8px;background:#efece3}
.peek .ph .mono{color:#9a5b2c}
.peek .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.peek b{font-size:15px}
.peek small{font-size:12px;color:#5d6762}
.peek .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.peek .acts button{border:1px solid #cfc9b8;background:#f3f1ea;color:#1f2a27;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}
.peek .acts button.go{background:#0f6b6f;border-color:#0f6b6f;color:#fff}
.peek .x{align-self:flex-start;border:0;background:none;font-size:18px;cursor:pointer;color:#5d6762;padding:0 4px}
/* motion */
@keyframes pulse{from{transform:scale(1);opacity:.95}to{transform:scale(3.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.15}}
.zone.flash .zr{animation:flick .5s ease-in-out 8}
@keyframes march{to{stroke-dashoffset:-32}}
.flow{animation:march .9s linear infinite}
@media (prefers-reduced-motion: reduce){.pulse,.zone.flash .zr,.flow{animation:none}}
/* live walking panel */
.walk{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));right:calc(64px + env(safe-area-inset-right,0px));top:12px;max-width:420px;background:#fffdf7;color:#1f2a27;border:1px solid #cfc9b8;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px 14px;display:flex;flex-direction:column;gap:7px;z-index:3}
.walk .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.walk .top b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.walk .big{font-size:42px;color:#1f2a27}
.walk .big span{color:#5d6762}
.walk .bar{height:7px;background:#e7e2d5;border-radius:999px;overflow:hidden}
.walk .bar i{display:block;height:100%;background:#e2552d;transition:width .5s}
.walk.done .bar i{background:#1f8a4c}
.walk .meta{font-size:13px;color:#5d6762;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.walk .msg{font-size:13px;margin:0;color:#1f2a27}
.walk .msg.warn{color:#b3361a;font-weight:600}
.walk .acts{display:flex;gap:6px;flex-wrap:wrap}
.walk button{border:1px solid #cfc9b8;background:#f3f1ea;color:#1f2a27;border-radius:7px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.walk button.go{background:#0f6b6f;border-color:#0f6b6f;color:#fff}
.walk button[aria-pressed="true"]{background:#1a73e8;border-color:#1a73e8;color:#fff}
body.walking .legend,body.walking .hint,body.walking .peek{display:none}
.walkcta{display:flex;flex-direction:column;gap:6px}
.gpstab{width:100%;border-collapse:collapse;font-size:13px}
.gpstab td,.gpstab th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.gpstab th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gpstab td.num{font-family:var(--f-num);font-size:12px}
.okbox{border-left:3px solid #1f8a4c;padding:6px 0 6px 12px;font-size:14px;margin:0}
.okbox.warn{border-color:var(--route)}
/* story page */
.story{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.story-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.story-bar .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-in{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.hero{border-radius:14px;aspect-ratio:16/8;max-height:56vh;cursor:zoom-in}
.hero.empty{cursor:default}
.hero .count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 9px;border-radius:999px}
.story h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.08;margin:4px 0 6px;text-wrap:balance}
.story .tag{font-size:18px;color:var(--muted);margin:0;max-width:60ch}
.story-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.story article{font-size:17px;line-height:1.7;max-width:65ch}
.story article p{margin:0 0 1em}
.facts{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.facts dl{margin:0;display:flex;flex-direction:column;gap:10px}
.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-variant-numeric:tabular-nums}
.facts .acts{display:flex;flex-direction:column;gap:8px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.story h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;display:flex;flex-direction:column;gap:4px;text-align:left}
.gallery .ph{aspect-ratio:4/3;border-radius:8px}
.gallery small{font-size:12px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.editbtn{display:none}
.editor .editbtn{display:inline-block}
/* editor */
.editf{display:flex;flex-direction:column;gap:14px;max-width:760px}
.ephotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ephoto{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.ephoto .ph{aspect-ratio:4/3}
.ephoto .pad{padding:8px;display:flex;flex-direction:column;gap:6px}
.ephoto .pad input{font-size:13px;padding:6px 8px}
.ephoto .acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{position:absolute;left:8px;top:8px;background:#0f6b6f;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.status{font-size:13px;color:var(--muted);min-height:1.2em;margin:0}
/* content manager page */
.admin{position:fixed;inset:0;z-index:22;background:var(--bg);display:flex;flex-direction:column}
.admin .story-bar{position:static;flex:0 0 auto}
.adbanner{flex:0 0 auto;background:var(--shade);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:13px}
.admin-in{flex:1;min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr)}
.adlist{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;min-width:0}
.adlist h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;font-weight:600}
.adlist h2:first-child{margin-top:0}
.aditem{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:6px;cursor:pointer;width:100%;min-width:0}
.aditem.on{background:var(--bg);border-color:var(--line)}
.aditem .th{width:46px;height:46px;border-radius:8px;overflow:hidden;position:relative;background:var(--shade);display:grid;place-items:center;flex:0 0 46px;font-family:var(--f-display);color:var(--teak)}
.aditem .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aditem .t{flex:1;min-width:0}
.aditem b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aditem small{color:var(--muted);font-size:12px}
.dd{width:9px;height:9px;border-radius:50%;background:var(--route);flex:0 0 9px}
.adform{overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 80px 28px;min-width:0}
.adform .editf{max-width:860px}
.adform h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:4px 0 0}
.drop.over{border-color:var(--river);background:var(--shade);color:var(--ink)}
.drop strong{color:var(--ink)}
.adgate{max-width:520px;margin:14vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.adgate h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}
.meter{height:6px;border-radius:999px;background:var(--shade);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--river)}
.ephoto .acts button{flex:1 1 auto}
/* lightbox */
.lb{position:fixed;inset:0;z-index:30;background:rgba(9,12,11,.95);color:#fff;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);touch-action:pan-y}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13px;gap:12px}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{left:12px}.lb .next{right:12px}
.lb-cap{padding:12px 16px 18px;text-align:center;font-size:14px;color:#e6e6e6;min-height:1.4em}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .mapwrap{order:-1;height:calc(100vh - var(--peek));height:calc(100dvh - var(--peek))}
  body.walking .mapwrap{height:calc(100vh - var(--peek));height:calc(100dvh - var(--peek))}
  /* resort information slides up from the bottom; the grab bar stays in reach */
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:88vh;max-height:88dvh;
    border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);overflow-y:auto;overscroll-behavior:contain;
    padding-block:0 calc(26px + env(safe-area-inset-bottom,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));
    transform:translateY(calc(100% - var(--peek)));
    transition:transform .34s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
  .rail.open{transform:translateY(0)}
  .rail.dragging{transition:none}
  .sheetgrab{position:sticky;top:0;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
    width:100%;padding:23px 0 13px;margin:0;background:var(--panel);border:0;border-bottom:1px solid transparent;
    color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer;touch-action:none}
  .sheetgrab::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:999px;background:var(--line)}
  .sheetgrab .chev{width:0;height:0;margin-bottom:6px;border-left:5px solid transparent;border-right:5px solid transparent;
    border-bottom:6px solid var(--muted);transition:transform .3s ease}
  .rail.open .sheetgrab{border-bottom-color:var(--line)}
  .rail.open .sheetgrab .chev{transform:rotate(180deg)}
  .story-grid{grid-template-columns:1fr}
  .hero{aspect-ratio:4/3}
  .admin-in{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .adlist{max-height:30vh;border-right:0;border-bottom:1px solid var(--line);padding-right:max(14px,env(safe-area-inset-right,0px))}
  .adform{padding-left:max(16px,env(safe-area-inset-left,0px))}
  body.walking .mapwrap{height:80vh}
  .admin .story-bar .note{display:none}
}
</style>

<template id="shell">
<div class="app">
  <aside class="rail" id="railPanel">
    <button class="sheetgrab" id="sheetGrab" aria-expanded="false" aria-controls="railPanel">
      <span class="lbl" data-i18n="sheet">Resort information</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="brand">
      <small data-i18n="brandSub">Sib San Resort &amp; Spa · Mae Taeng</small>
      <h1 data-i18n="title">Villa &amp; Route Finder</h1>
      <p data-i18n="intro">29-acre property, scaled to metres. Tap any villa, venue or highlighted area on the map.</p>
      <button class="btn sm editbtn" id="manageBtn" style="align-self:flex-start;margin-top:10px">Manage content &amp; photos</button>
    </div>

    <section class="sec">
      <h2 data-i18n="findVilla">Find a villa</h2>
      <div class="row">
        <label class="f"><span data-i18n="villaNo">Villa number</span><input id="q" type="text" inputmode="numeric" list="villalist" placeholder="e.g. 2124" autocomplete="off"></label>
        <button class="btn primary" id="findBtn" data-i18n="locate">Locate</button>
      </div>
      <datalist id="villalist"></datalist>
      <p class="err" id="qerr" hidden></p>
      <div class="villa-card" id="vcard" hidden></div>
    </section>

    <section class="sec">
      <h2 data-i18n="explore">Explore the resort</h2>
      <div class="explore" id="explore"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="highlighted">Highlighted areas</h2>
      <div class="row" style="align-items:stretch">
        <button class="btn sm" id="flashSmoke" data-i18n="showSmoke">Show all smoking areas</button>
        <button class="btn sm" id="nearSmoke" data-i18n="nearSmoke">Nearest to start point</button>
      </div>
      <div class="areas" id="areas"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="routeBetween">Route between two points</h2>
      <label class="f"><span><span class="dot" style="background:var(--from)"></span> <span data-i18n="from">From</span></span><select id="from"></select></label>
      <div class="row">
        <label class="f"><span><span class="dot" style="background:var(--to)"></span> <span data-i18n="to">To</span></span><select id="to"></select></label>
        <button class="btn" id="swap" data-i18n-attr="title aria-label:swap" title="Swap from and to" aria-label="Swap from and to">⇅</button>
      </div>
      <div class="result" id="result"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="quickRoutes">Quick routes from Lobby</h2>
      <div class="chips" id="chips"></div>
    </section>

    <section class="sec">
      <h2 data-i18n="measureScale">Measure &amp; scale</h2>
      <div class="row">
        <button class="btn" id="measureBtn" aria-pressed="false" data-i18n="measureDist">Measure distance</button>
        <label class="f"><span data-i18n="propArea">Property area (acres)</span><input id="acres" type="number" min="1" step="0.5" value="29"></label>
      </div>
      <p class="note" id="scaleNote"></p>
    </section>

    <section class="sec">
      <h2 data-i18n="hoursCalls">Hours &amp; calls</h2>
      <div class="hours">
        <span data-i18n="hFront">Front Desk (24 h, golf car)</span><span data-i18n="dial0">Dial 0</span>
        <span data-i18n="hRest">Sib San Cuisine</span><span data-i18n="dial4000">Dial 4000</span>
        <span data-i18n="hBreakfast">Breakfast</span><span><bdi>07:00–10:00</bdi></span>
        <span data-i18n="hDinner">Dinner last order</span><span><bdi>21:00</bdi></span>
        <span data-i18n="hCafe">Mae Taeng River View Café</span><span><bdi>10:00–18:00</bdi></span>
        <span data-i18n="hTower">High Tower</span><span><bdi>06:00–18:00</bdi></span>
        <span data-i18n="hFitPool">Fitness &amp; Pool</span><span><bdi>07:00–19:00</bdi></span>
      </div>
    </section>
    <p class="note" data-i18n="footNote">Distances follow the resort walkways drawn on the plan and are estimates (about ±10 m). Walking at 4.5 km/h, golf car at 12 km/h.</p>
  </aside>

าง พลอยทองซึ่งตาบอดไม่สามารถตามโขลงหนีน้ำที่เพิ่มสูงขึ้นได้ทัน ส่วนฟ้าใสถูกกระแสน้ำพัดพาไปขณะที่เจ้าหน้าที่เร่งอพยพช้างไปยังที่สูง ภายหลังพบร่างของทั้งสองในแม่น้ำใกล้กับบริเวณรีสอร์ทแห่งนี้ จึงเป็นที่มาว่าเหตุใดอนุสรณ์จึงตั้งอยู่ที่นี่ แทนที่จะเป็นที่ปางช้างเอง\n\nข้อความจารึกไว้ว่า “แม้ดวงตาจะมองไม่เห็น แต่หัวใจอันเจิดจรัสของเธอคือแสงนำทาง อ่อนโยนและเปี่ยมด้วยความเป็นแม่ เธอใช้ชีวิตด้วยความรัก ทิ้งไว้ซึ่งมรดกแห่งความเมตตาและความกล้าหาญที่จะคงอยู่ตลอดไป” (พลอยทอง) และ “เส้นทางชีวิตของเธอพาเธอจากความทุกข์ทรมานสู่ที่พักพิง ซึ่งเธอได้เบ่งบานท่ามกลางความอบอุ่นของครอบครัวและอิสรภาพ จิตวิญญาณอันเป็นอิสระและร่าเริงของฟ้าใสยังคงเป็นของขวัญล้ำค่าแก่ทุกคนที่เคยรู้จักเธอ” (ฟ้าใส)\n\nเชิญผู้มาเยือนร่วมแสดงความอาลัย สอบถามแผนกต้อนรับเกี่ยวกับกิจกรรมและงานต่าง ๆ ที่จัดขึ้นในลานแห่งนี้ระหว่างการเข้าพักของคุณ","tips":["เดินผ่านสะพานข้างคาเฟ่ริมน้ำ","โปรดสำรวมและให้เกียรติสถานที่ — ที่นี่เป็นอนุสรณ์สถาน"]},"farm":{"name":"ฟาร์มออร์แกนิก","tagline":"แหล่งปลูกผลผลิตของรีสอร์ท","call":"กด 0","story":"ฟาร์มออร์แกนิกอยู่ทางฝั่งตะวันออกของรีสอร์ท เลยเส้นวงรอบสีฟ้าและสำนักงานออกไป\n\nสอบถามแผนกต้อนรับว่าสามารถจัดการเยี่ยมชมฟาร์มระหว่างการเข้าพักของคุณได้หรือไม่","tips":["เยี่ยมชมได้โดยนัดหมายผ่านแผนกต้อนรับ"]},"bicycle":{"name":"ลานจักรยาน","tagline":"จักรยานฟรีสำหรับปั่นชมรีสอร์ท","call":"กด 0","story":"ลานจักรยานอยู่ด้านบนของลานจอดรถ ติดกับทางเข้าหลัก จักรยานมีให้ผู้เข้าพักใช้ฟรีเพื่อชมรีสอร์ท\n\nทางเดินวงรอบสีฟ้าเหมาะกับการปั่นสบาย ๆ จากล็อบบี้ไปทางตะวันออกผ่านวิลล่ากลุ่ม 2100 ลงไปถึงคาเฟ่ริมน้ำ แล้ววนกลับ","tips":["ฟรีสำหรับผู้เข้าพักเท่านั้น ปั่นได้ภายในรีสอร์ท ไม่อนุญาตให้ปั่นออกนอกรีสอร์ท","ปั่นช้า ๆ และหลีกทางให้คนเดินและรถกอล์ฟ","กรุณานำจักรยานมาคืนที่นี่ก่อนค่ำ"]},"conference":{"name":"ห้องประชุม","tagline":"ประชุมและจัดงานใกล้ทางเข้าหลัก","call":"กด 0","story":"ห้องประชุมอยู่ข้างลานจอดรถ ใกล้ทางเข้าหลัก และเดินจากล็อบบี้เพียงไม่ไกล\n\nสำหรับการประชุม สัมมนา หรืองานส่วนตัว กรุณาติดต่อแผนกต้อนรับเพื่อตรวจสอบวันว่างและรายละเอียด","tips":["จองผ่านแผนกต้อนรับ"]},"carpark":{"name":"ลานจอดรถ","tagline":"จอดรถฟรีที่ทางเข้าหลัก"},"office":{"name":"สำนักงาน","tagline":"พื้นที่พนักงาน"},"staff":{"name":"บ้านพักพนักงาน","tagline":"พื้นที่พนักงาน"},"smoke1":{"name":"จุดสูบบุหรี่ · สวนล็อบบี้","tagline":"จุดสูบบุหรี่ที่กำหนดไว้ในสวนล็อบบี้"},"smoke2":{"name":"จุดสูบบุหรี่ · สวนสระว่ายน้ำ","tagline":"จุดสูบบุหรี่ที่กำหนดไว้ใกล้วิลล่า 1004–1005"},"smoke3":{"name":"จุดสูบบุหรี่ · สวนตะวันตก","tagline":"จุดสูบบุหรี่ที่กำหนดไว้ใกล้วิลล่า 1008 และ 1011"},"entrance":{"name":"ทางเข้าหลักของรีสอร์ท"},"redbridge1":{"name":"สะพานแดงหมายเลข 1"}},"ar":{"lobby":{"name":"الردهة ومكتب الاستقبال","tagline":"حيث تبدأ كل إقامة، بخدمة على مدار الساعة","hours":"24 ساعة","call":"اطلب 0 (المقسم)","story":"تقع الردهة في قلب سيبسان، بين موقف السيارات وحديقة المسبح. هي أول مكان تصل إليه وأسهل مكان تعود إليه: فكل مسار على هذه الخريطة يبدأ من هنا.\n\nفريق الاستقبال متواجد على مدار 24 ساعة. اطلب 0 من هاتف الفيلا لحجز عربة غولف توصلك إلى فيلتك، أو لترتيب الجولات والتنقلات، أو لطلب أي شيء تحتاجه خلال إقامتك.\n\nمن الردهة ينقسم الممر إلى اتجاهين. اتجه غربًا إلى حديقة المسبح للوصول إلى مطعم سيبسان وسبا كالابا والمسبح والبرج العالي. واتجه شرقًا على المسار الأزرق الدائري بمحاذاة فلل 2100 للوصول إلى مقهى إطلالة نهر ماي تاينغ والجسر.","tips":["خدمة عربة الغولف: اطلب 0 في أي وقت","تسجيل الدخول من الساعة 15:00، والمغادرة قبل 12:00","اسأل الفريق عن محميات الفيلة والتجديف والرحلات القريبة"]},"restaurant":{"name":"مطعم سيبسان","tagline":"مأكولات تايلاندية وعالمية بجوار المسبح","hours":"الإفطار ⁦07:00–10:00⁩ · آخر طلب للعشاء 21:00","call":"اطلب 4000","story":"رحلة من النكهات تنتظرك في مطعم سيبسان، حيث تفتح روائح الأطباق المتنوعة شهيتك وتسعد ذائقتك. يقدم المطعم تشكيلة واسعة من الأطباق التايلاندية المحلية إلى الأطباق العالمية المفضلة، بما يلبي كل رغبة.\n\nالأثاث المريح والديكور الأنيق والخدمة الودودة والأجواء المحيطة الوارفة، كلها تضاعف متعة تجربة طعام لا تُنسى. اختر بين الجلسات الداخلية الهادئة أو منطقة الطعام في الهواء الطلق الملحقة بها، المثالية لعشاء رومانسي على ضوء الشموع.","tips":["الإفطار ⁦07:00–10:00⁩","آخر طلب للعشاء 21:00","أخبر الفريق إذا كنت تفضل طعامًا أقل حرارة"]},"spa":{"name":"سبا كالابا","tagline":"جلسات على مهل في حديقة المسبح","hours":"يفتح يوميًا","call":"اطلب 0 للحجز","story":"التخلص من التوتر والضغط أمر جوهري لتحسين العافية العامة والحفاظ عليها. فارتفاع ضغط الدم وتسارع خفقان القلب وضعف المناعة هي غالبًا الثمن الذي ندفعه لنمط حياتنا اليومي. وحين تختل أجهزة الجسم، تتأثر صحتنا الجسدية والنفسية معًا، فيأتي الاكتئاب والملل وضعف تقدير الذات وانعدام السعادة. سبا كالابا ملاذ للسكينة والعناية، تتجسد فيه ضيافة السبا التايلاندية الشرقية عبر جلسات وطقوس مصممة بعناية لتنشيط الحواس وتهدئتها وتجديدها، بجودة عالية وتجربة شخصية.\n\nمع وميض الشموع ومصابيح الزيت وشاي اللانا التايلاندي والمأكولات الأصيلة، تُقدَّم جلسات كالابا المميزة في أجواء تستحضر طابع اللانا التايلاندي. فالجسد والعقل وجهان لعملة واحدة، وكلاهما يحتاج إلى رعاية دون إهمال أحدهما. وفي كالابا نولي أهمية بالغة للحفاظ على توازن الجسد والعقل، إذ نؤمن أن العقل المتوازن يسكن جسدًا متوازنًا، وأن الجسد المتوازن يغذّي عقلًا متوازنًا. وثمرة ذلك صحة جيدة وسعادة وشباب وعمر مديد، تتضافر لتمنحنا الطاقة على مواجهة ضغوط الحياة اليومية بصورة دائمة. هذا ما تعنيه كالابا: الخلود، ونودّ أن نشارك هذا المعنى مع الجميع.\n\nمعالجونا المحترفون مستعدون لتلبية كل رغبة باختيار الجلسة الأنسب لك. سبا كالابا — حيث يجتمع الجمال والراحة والخبرة والعناية الشخصية لتكوين تجربة لا تُنسى ومجددة للطاقة.","tips":["احجز عبر مكتب الاستقبال: اطلب 0","احضر قبل الموعد بدقائق للاستقرار"]},"pool":{"name":"المسبح","tagline":"مسبح بتصميم حر في قلب الحديقة","hours":"⁦07:00–19:00⁩","call":"اطلب 0","story":"وسط جمال الجبال الآسر، يدعوك المسبح ذو التصميم الحر في قلب منتجع سيبسان ماي تاينغ إلى الاسترخاء في أجواء فاخرة. أرح كل عضلة في جسدك وأنت تطفو على الماء متأملًا الطبيعة من حولك وصفاء السماء، أو استمتع بالمساج المائي في منطقة الجاكوزي. وارتشف مشروبًا من بار المسبح لتكتمل أجمل فترة بعد ظهر هادئة.","tips":["يفتح ⁦07:00–19:00⁩","يجب أن يكون الأطفال تحت إشراف شخص بالغ طوال الوقت","مناشف المسبح متوفرة عند المسبح"]},"tower":{"name":"البرج العالي","tagline":"مطل على أسطح المنتجع وحدائقه","hours":"⁦06:00–18:00⁩","story":"يقع البرج العالي في الركن الشمالي الغربي من حديقة المسبح، بجوار سبا كالابا. اصعد إلى أعلاه لترى أسطح المنتجع وحدائقه وصولًا إلى أرياف ماي تاينغ المحيطة.\n\nيفتح البرج عند الساعة 06:00، فيتمكن أصحاب الاستيقاظ المبكر من التمتع بضوء الصباح قبل الإفطار. ويغلق عند 18:00.","tips":["يفتح ⁦06:00–18:00⁩","اصعد الدرج بحذر وأمسك الدرابزين","أبقِ الأطفال قريبين منك في الأعلى"]},"fitness":{"name":"النادي الرياضي","tagline":"حافظ على روتينك الرياضي في العطلة","hours":"⁦07:00–19:00⁩","call":"اطلب 0","story":"تؤدي الصحة واللياقة البدنية دورًا مهمًا في جودة الحياة. حافظ على لياقتك ونشّط دورتك الدموية بأجهزتنا: أجهزة المشي، وأجهزة الدفع الصدري والعلوي، والدراجات الثابتة، إضافة إلى منطقة الأوزان الحرة ومقعد الضغط.","tips":["يفتح ⁦07:00–19:00⁩","يرجى ارتداء حذاء رياضي مناسب"]},"cafe":{"name":"مقهى إطلالة نهر ماي تاينغ","tagline":"قهوة ومأكولات خفيفة على ضفة النهر","hours":"⁦10:00–18:00⁩","call":"اطلب 0","story":"مقهى إطلالة نهر ماي تاينغ جناح لانا مكشوف وجميل، يقع على ضفة النهر بإطلالة خلابة. الديكور القبلي الذي تزينه منسوجات قبائل الجبال الملونة يمنح أجواءً مثالية للاسترخاء مع كتاب وفنجان قهوة. أو اجلس في الخارج على الشرفة الشمسية لمشاهدة الفيلة وهي تسير بمحاذاة النهر عن قرب. ولا تنسَ تذوق المعجنات الشهية المعروضة.","tips":["يفتح ⁦10:00–18:00⁩","على بُعد نحو 6 دقائق سيرًا من الردهة"]},"bridge":{"name":"الجسر ونهر ماي تاينغ","tagline":"اعبر النهر إلى الفناء","story":"يعبر الجسر نهر ماي تاينغ بجوار مقهى إطلالة النهر، ويؤدي إلى الفناء على الضفة المقابلة.\n\nوهو مكان جميل للتوقف والنظر إلى النهر في الاتجاهين، ونقطة انطلاق المسير إلى الفناء.","tips":["أبقِ الأطفال قريبين على الجسر وضفة النهر","يُرجى عدم السباحة في النهر"]},"courtyard":{"name":"الفناء","tagline":"مساحة مفتوحة عبر النهر · نصب تذكاري للفيلة","call":"اطلب 0","story":"الفناء مساحة مفتوحة على الضفة الأخرى من نهر ماي تاينغ. يمكن الوصول إليه سيرًا بعبور الجسر من مقهى إطلالة النهر.\n\nيقف هنا نصب تذكاري لتكريم الفيلين بلوي ثونغ وفا ساي، وهما فيلان تم إنقاذهما وكانا يعيشان في Elephant Nature Park، على بعد بضعة كيلومترات أعلى النهر في ماي تاينغ. في 4 أكتوبر 2024، اجتاحت فيضانات مفاجئة شديدة المنتزه. لم تستطع بلوي ثونغ، التي كانت كفيفة، مواكبة القطيع أثناء فراره من ارتفاع منسوب المياه؛ بينما جرفت المياه فا ساي بينما كان القائمون على المنتزه يعملون على إجلاء الفيلة إلى أرض مرتفعة. عُثر لاحقًا على جثتيهما في النهر بالقرب من أراضي هذا المنتجع، وهو سبب إقامة النصب التذكاري هنا بدلاً من المنتزه نفسه.\n\nتقول النقوش: «رغم أن عينيها لم تكونا تُبصران، إلا أن قلبها المشرق كان نورها الهادي. كانت رقيقة وحنونة، عاشت بالحب، وتركت إرثًا من اللطف والشجاعة سيبقى خالدًا» (بلوي ثونغ)، و«رحلتها نقلتها من المعاناة إلى الملاذ الآمن، حيث ازدهرت في دفء الأسرة والحرية. روح فا ساي الحرة والمرحة تبقى هدية خالدة لكل من عرفها» (فا ساي).\n\nنرحب بالزوار لتقديم احترامهم. يُرجى سؤال مكتب الاستقبال عن الأنشطة والفعاليات التي تقام أيضًا في هذا الفناء خلال إقامتكم.","tips":["اسلك الجسر المجاور لمقهى إطلالة النهر","يرجى التحلي بالاحترام — هذا موقع تذكاري"]},"farm":{"name":"المزرعة العضوية","tagline":"حيث يزرع المنتجع محاصيله","call":"اطلب 0","story":"تقع المزرعة العضوية في الجانب الشرقي من المنتجع، خلف المسار الأزرق الدائري والمكتب الإداري.\n\nاسأل مكتب الاستقبال عن إمكانية ترتيب زيارة للمزرعة خلال إقامتك.","tips":["الزيارات بترتيب مسبق عبر مكتب الاستقبال"]},"bicycle":{"name":"منطقة الدراجات","tagline":"دراجات مجانية لاستكشاف المنتجع","call":"اطلب 0","story":"تقع منطقة الدراجات أعلى موقف السيارات، بجوار المدخل الرئيسي. والدراجات متاحة مجانًا للنزلاء لاستكشاف المنتجع.\n\nالمسار الأزرق الدائري مثالي لجولة سهلة: من الردهة شرقًا بمحاذاة فلل 2100، نزولًا إلى مقهى إطلالة النهر، ثم العودة.","tips":["مجانية لنزلاء المنتجع فقط، ويُسمح باستخدامها داخل المنتجع ولا يُسمح بالخروج بها","قُد ببطء وأفسح الطريق للمشاة وعربات الغولف","يرجى إعادة الدراجات إلى هنا قبل حلول الظلام"]},"conference":{"name":"قاعة الاجتماعات","tagline":"اجتماعات وفعاليات قرب المدخل الرئيسي","call":"اطلب 0","story":"تقع قاعة الاجتماعات بجوار موقف السيارات، قريبًا من المدخل الرئيسي وعلى مسافة قصيرة سيرًا من الردهة.\n\nللاجتماعات أو الندوات أو المناسبات الخاصة، تواصل مع مكتب الاستقبال للاطلاع على المواعيد المتاحة والترتيبات.","tips":["الحجز عبر مكتب الاستقبال"]},"carpark":{"name":"موقف السيارات","tagline":"وقوف مجاني عند المدخل الرئيسي"},"office":{"name":"المكتب الإداري","tagline":"منطقة الموظفين"},"staff":{"name":"سكن الموظفين","tagline":"منطقة الموظفين"},"smoke1":{"name":"منطقة تدخين · حديقة الردهة","tagline":"منطقة تدخين مخصصة في حديقة الردهة"},"smoke2":{"name":"منطقة تدخين · حديقة المسبح","tagline":"منطقة تدخين مخصصة قرب الفلل ⁦1004–1005⁩"},"smoke3":{"name":"منطقة تدخين · الحديقة الغربية","tagline":"منطقة تدخين مخصصة قرب الفيلتين 1008 و1011"},"entrance":{"name":"المدخل الرئيسي للمنتجع"},"redbridge1":{"name":"الجسر الأحمر رقم 1"}}}}</script>
<script type="application/json" id="state">{"places":{"lobby":{"name":"Lobby & Front Desk","tagline":"Where every stay begins, staffed around the clock","hours":"24 hours","call":"Dial 0 (Operator)","story":"The Lobby sits at the heart of Sib San, between the car park and the pool garden. It is the first place you arrive and the easiest place to find again: every route on this map starts here.\n\nThe Front Desk team is on duty 24 hours a day. Call 0 from your villa phone to book a golf car to your villa, arrange tours and transfers, or ask for anything you need during your stay.\n\nFrom the Lobby, the walkway splits in two. Head west into the pool garden for Sib San Cuisine, Kalapa Spa, the pool and the High Tower. Head east along the blue loop past the 2100 villas to the Mae Taeng River View Café and the bridge.","tips":["Golf car service: dial 0 at any time","Check-in from 15:00, check-out by 12:00","Ask the team about elephant sanctuaries, rafting and other trips nearby"],"photos":[]},"restaurant":{"name":"Sib San Cuisine","tagline":"Thai and international dining beside the pool","hours":"Breakfast 07:00–10:00 · Dinner last order 21:00","call":"Dial 4000","story":"A gourmet journey awaits at Sibsan Cuisine, where the scent of a wide array of culinary delights will rouse your appetite and thrill your taste buds. The restaurant offers an assorted range of dishes from local Thai to international favourites – which will pamper your very craving.\n\nThe comfortable furniture, elegant décor, friendly service and the plush surrounding amplify an unforgettable dining experience. Choose between relaxing indoor seatings or an al fresco dining area attached for a perfect romantic candlelit dinners.","tips":["Breakfast 07:00–10:00","Dinner last order 21:00","Let the team know if you would like your food less spicy"],"photos":[{"id":"7c51d8d12ebf9892ae8cd584713a57e0","caption":""},{"id":"0abf17ab330e11b31a2dc183f3879205","caption":""},{"id":"ab6eb2e1bc504e024fbca5bc9e8d2844", esses ETERNALLY… This is what Kalapa stand for ETERNAL and we would like to share this with everyone.\n\nOur professional therapists are ready to fulfill every desire by selecting the perfect treatment for you. Kalapa Spa - a place where beauty, comfort, knowledge, and personalized attention, combine to create a totally memorable and rejuvenating experience.","tips":["Book through the Front Desk: dial 0","Arrive a few minutes early to settle in"],"photos":[{"id":"8fa9fb704a0c6308e291c828f4397a6a","caption":""},{"id":"a84c50363298704903c9161615b47e6f","caption":""},{"id":"770ddbf30d40678ca31bb1791cb61109","caption":""},{"id":"b73d5b27264f5043e11845ea5a6490d2","caption":""},{"id":"a8540fe88cf6e987d9d502ce0e718be2","caption":""},{"id":"876b2b2ac33cc175b92c7f0e33a70335","caption":""},{"id":"836c20f600a9fc8c83143c4f79ac3e95","caption":""},{"id":"b75ef2d66ea7eca1df42356a91cfc9ae","caption":""},{"id":"922b6f17464bb1dde72dbd4bd52bbac7","caption":""},{"id":"4a94e12c34ab4748760ca1e23002f434","caption":""},{"id":"e2b107f8eda154b7fcfdc1e029439659","caption":""},{"id":"db10c2ad62ab00377db6e504380e3176","caption":""},{"id":"ae3cc35c16b19e622c07ee82785f1637","caption":""},{"id":"529d4a0d18fef203ec3589e5c06bf406","caption":""}]},"pool":{"name":"Swimming Pool","tagline":"The free-form pool at the centre of the garden","hours":"07:00–19:00","call":"Dial 0","story":"Surrounded by the gorgeous beauty of mountain, the free-form swimming pool in the heart of at Sibsan Resort & Spa Maetaeng invites guests to unwind in pure luxury. Relax each and every muscle in the body by floating on for hour to gaze at the surrounding nature and the clear sky; or enjoy a hydro massage in the Jacuzzi zone. Sip a drinks at the poolside bar will make the perfect lazy afternoon!","tips":["Open 07:00–19:00","Children must be watched by an adult at all times","Pool towels are available at the pool"],"photos":[{"id":"4012e6fd92e74aabe3fcde0907b07e1f","caption":""},{"id":"eabd80d51dd756f185f3a2fa603f668d","caption":""},{"id":"3b1eccc8a8687fd3cbd4c6391b6cc80a","caption":""},{"id":"8ce2fe4c02987088485b0b36895653a3","caption":""}]},"tower":{"name":"High Tower","tagline":"A lookout over the resort's rooftops and gardens","hours":"06:00–18:00","call":"","story":"The High Tower stands at the north-west corner of the pool garden, next to Kalapa Spa. Climb to the top for a view across the resort's rooftops and gardens to the surrounding Mae Taeng countryside.\n\nThe tower opens at 06:00, so early risers can take in the morning light before breakfast. It closes at 18:00.","tips":["Open 06:00–18:00","Take the stairs with care and hold the handrail","Keep children close at the top"],"photos":[{"id":"b264e840d1b3e78818ea8ce0122c697d","caption":""},{"id":"0e9d8922ceb73b1044fa39fcb211db25","caption":""},{"id":"2c9fe3f2c179cf4777fc48171c62a25b","caption":""},{"id":"4625dc868ad4e6a05281ca6e0721e96a","caption":""},{"id":"fc846336f3044e8647cbc9f92162a37a","caption":""},{"id":"5a2131ad8537ffdb75bf4e300672a286","caption":""},{"id":"3897014bbc2799cea4d9318988433dd7","caption":""},{"id":"b18dfe7e6b38ef0094ddc5e7214534fe","caption":""},{"id":"0be8c5b1b6636daf72ed097bd1dc0a57","caption":""},{"id":"d68b960f80706000f7c5ae0865b68f26","caption":""}]},"fitness":{"name":"Fitness Centre","tagline":"Keep up your routine on holiday","hours":"07:00–19:00","call":"Dial 0","story":"Health and physical fitness play an important roles that determine a good quality of life. Keep fit and get your blood pumping with our gym equipment like treadmills, chest and overhead presses, and upright bikes, alongside is the free weights with bench press.","tips":["Open 07:00–19:00","Wear proper sports shoes"],"photos":[{"id":"c8963c1e0b534b6d3918ae0cc72b6886","caption":""},{"id":"175ba73a3b3abf1d1a1f198d36b88b9d","caption":""}]},"cafe":{"name":"Mae Taeng River View Café","tagline":"Coffee and light bites on the riverbank","hours":"10:00–18:00","call":"Dial 0","story":"Maetaeng River View Café is a beautiful open air Lanna gazebo, sit on the banks of the river with a breathtaking view. The tribal décor of the lounge accentuated by the colourful of hill tribe’s weaving offers a perfect ambiance to unwind with a book over a cup of coffee. Or else, sit outdoor on sundeck to watch the elephants marching by the river closely. Don’t forget to taste some of the mouthwatering pastries showcase.","tips":["Open 10:00–18:00","About a 6-minute walk from the Lobby"],"photos":[{"id":"b77df3f11d80612fd9794c8de731a1a3","caption":""},{"id":"761496cdbf17308766a8f94c6fa18b5d","caption":""},{"id":"e94fb673fae46e350514c0752ec2f36d","caption":""},{"id":"35e437e4698acd045fd9022c204b9fc4","caption":""},{"id":"a6cae6e083300488fae92bfb105e13bc","caption":""},{"id":"61761d0b1e56545c343874d90cda8787","caption":""},{"id":"ba4f4d07f6267330557b60789d642993","caption":""},{"id":"034ebf8804217c21233dbe43a6aeeefe","caption":""},{"id":"0ab7a59ef9820662e8bf349a62a4003f","caption":""},{"id":"2618bdbc89df5b8b803cdc4bbfb40f73","caption":""},{"id":"8d6ddcac559ad2466514afcb39295b16","caption":""},{"id":"e9b0bf064cc5a95de07f2206b37350ec","caption":""},{"id":"9ccbbb3c794c976e2ef6deb7a5d6a8f0","caption":""},{"id":"7553f6699b29e0e34c7360dd664eb824","caption":""},{"id":"b473288a0d9708a6745fe2262f5028b0","caption":""},{"id":"0dbb1ff50ed49e2cdfa45d96d09d263e","caption":""},{"id":"2e0ad9a1384e00a833c70132ff431300","caption":""}]},"bridge":{"name":"Bridge & Mae Taeng River","tagline":"Cross the river to the courtyard","hours":"","call":"","story":"The bridge crosses the Mae Taeng River beside the River View Café and leads to the courtyard on the far bank.\n\nIt is a good place to pause and look up and down the river, and the start of the walk to the courtyard.","tips":["Keep children close on the bridge and the riverbank","Do not swim in the river"],"photos":[{"id":"2428d50a1f7ffe267e5f451336f2bbf9","caption":""},{"id":"12388447c7a505dc13d99f5740dae507","caption":""},{"id":"1881bf0ced2ac2e9c59e5d5a5d5e7e68","caption":""},{"id":"cd598b97dda18e70b820db6a00f6a30d","caption":""}]},"courtyard":{"name":"Courtyard","tagline":"Open space across the river · Elephant memorial","hours":"","call":"Dial 0","story":"The courtyard is an open space on the far side of the Mae Taeng River. Reach it on foot by crossing the bridge from the River View Café.\n\nHere stands a memorial to Ploy Thong and Faa Sai, two rescued elephants who lived at Elephant Nature Park, a few kilometres upriver in Mae Taeng. On 4 October 2024, severe flash floods swept through the park. Ploy Thong, who was blind, could not keep pace with the herd as they fled the rising water; Faa Sai was swept away while the park’s keepers worked to evacuate the elephants to higher ground. Their bodies were later recovered from the river near these resort grounds, which is why their memorial stands here rather than at the park itself.\n\nThe inscriptions read: “Though her eyes could not see, her radiant heart was her guiding light. Gentle and maternal, she lived by love, leaving behind a legacy of kindness and courage that will always endure” (Ploy Thong), and “Her journey carried her from suffering to sanctuary, where she flourished in the warmth of family and freedom. Faa Sai’s wild, joyful spirit remains a lasting gift to all who knew her” (Faa Sai).\n\nVisitors are welcome to pay their respects. Ask the Front Desk about activities and events also held in this courtyard during your stay.","tips":["Walk via the bridge beside the River View Café","Please be respectful — this is a memorial site"],"photos":[{"id":"91edb0d110bf105578a56c1c88fdb508","caption":""},{"id":"c5879be050ada9713018da844849e4c6","caption":""},{"id":"f82fee7aa5b95a0a608c8fc9a1f08a73","caption":""}]},"farm":{"name":"Organic Farm","tagline":"Where the resort grows its own produce","hours":"","call":"Dial 0","story":"The Organic Farm lies on the east side of the property, beyond the blue loop and the Work Office.\n\nAsk the Front Desk whether a farm visit can be arranged during your stay.","tips":["Visits by arrangement through the Front Desk"],"photos":[]},"bicycle":{"name":"Bicycle Area","tagline":"Free bicycles for exploring the resort","hours":"","call":"Dial 0","story":"The bicycle area is at the top of the car park, beside the main entrance. Bicycles are free for guests to explore the resort.\n\nThe blue loop walkway makes an easy ride: from the Lobby east past the 2100 villas, down to the River View Café, and back.","tips":["Free for in-house guests only ride in the resort but not allow to ride outside of the resort.","Ride slowly and give way to people walking and golf cars","Please return bicycles here before dark"],"photos":[{"id":"500d460756d0e973d806703fe90e764e","caption":""},{"id":"6150dd70fac972eb95f76138d17c51d2","caption":""},{"id":"c614eb4bed41c76a9a83250ce862ce01","caption":""},{"id":"0491b1948bc687eebe329de51a8c9e84","caption":""}]},"conference":{"name":"Conference Room","tagline":"Meetings and events near the main entrance","hours":"","call":"Dial 0","story":"The Conference Room sits beside the car park, close to the main entrance and a short walk from the Lobby.\n\nFor meetings, seminars or private events, contact the Front Desk to check availability and arrangements.","tips":["Bookings through the Front Desk"],"photos":[{"id":"3f437353e26d03f6d6b732d0b7c07c2c","caption":""},{"id":"f5ac8fe5072c61bd83b8110c5dae5f38","caption":""},{"id":"ca273d1940f605001b6f7e0db98c0a9c","caption":""}]},"carpark":{"name":"Car Park","tagline":"Free parking at the main entrance","hours":"","call":"","story":"","tips":[],"photos":[]},"office":{"name":"Work Office","tagline":"Staff area","hours":"","call":"","story":"","tips":[],"photos":[]},"staff":{"name":"Staff House","tagline":"Staff area","hours":"","call":"","story":"","tips":[],"photos":[]},"smoke1":{"name":"Smoking Area · Lobby Garden","tagline":"Designated smoking area in the Lobby garden","hours":"","call":"","story":"","tips":[],"photos":[{"id":"18cfb8d7ce1d9bf51b639fc2cb1850d7","capti <script id="main">
(function(){

const GEO=JSON.parse($("geo").textContent);
const I18N=JSON.parse($("i18n").textContent);

const LANGS=["en","zh","th","ar"];

  else{const n=(navigator.language||"").toLowerCase();
    LANG=n.startsWith("zh")?"zh":n.startsWith("th")?"th":n.startsWith("ar")?"ar":"en";}}catch(e){}
function T(k,v){
  const d=I18N.ui[LANG]||{},en=I18N.ui.en||{};
  let s=d[k]!=null?d[k]:en[k];

  if(v)for(const n in v)s=s.split("{"+n+"}").join(v[n]);

  (root||document).querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=T(e.getAttribute("data-i18n"));});
  (root||document).querySelectorAll("[data-i18n-attr]").forEach(e=>{
    for(const part of e.getAttribute("data-i18n-attr").split(";")){
      const [attrs,key]=part.split(":");if(!key)continue;
      for(const a of attrs.trim().split(/\s+/))e.setAttribute(a,T(key.trim()));}});

}
const NS="http://www.w3.org/2000/svg", W=1100, H=850;

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- resort information sheet (mobile) ----------
   Slides down out of the way; press or drag the grab bar to slide it back up. */
const railEl=$("railPanel"),grabEl=$("sheetGrab");
const sheetMQ=window.matchMedia?matchMedia("(max-width:860px)"):null;
const isSheet=()=>!!sheetMQ&&sheetMQ.matches;
const peekPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--peek"))||62;
function setSheet(open){

  if(grabEl)grabEl.setAttribute("aria-expanded",open?"true":"false");

function closeSheet(){if(isSheet()&&railEl&&railEl.classList.contains("open"))setSheet(false);}
/* keep --peek equal to the grab bar's real height, so the collapsed sheet shows the bar and nothing else */
function syncPeek(){if(!grabEl||!isSheet())return;

  if(h>0)document.documentElement.style.setProperty("--peek",h+"px");}
if(grabEl&&railEl){
  let sy=0,lastY=0,lastT=0,vel=0,baseOpen=false,travel=0,dragging=false,moved=false;
  grabEl.addEventListener("pointerdown",e=>{
    if(!isSheet())return;
    dragging=true;moved=false;baseOpen=railEl.classList.contains("open");
    sy=lastY=e.clientY;lastT=performance.now();vel=0;
    travel=Math.max(1,railEl.getBoundingClientRect().height-peekPx());
    railEl.classList.add("dragging");
    try{grabEl.setPointerCapture(e.pointerId);}catch(err){}});
  grabEl.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dy=e.clientY-sy;
    if(Math.abs(dy)>4)moved=true;
    const y=Math.max(0,Math.min(travel,(baseOpen?0:travel)+dy));
    railEl.style.transform="translateY("+y+"px)";
    const now=performance.now();
    if(now>lastT){vel=(e.clientY-lastY)/(now-lastT);lastY=e.clientY;lastT=now;}});
  const endDrag=()=>{
    if(!dragging)return;
    dragging=false;railEl.classList.remove("dragging");
    const m=/translateY\(([-\d.]+)px\)/.exec(railEl.style.transform);
    const y=m?parseFloat(m[1]):(baseOpen?0:travel);
    railEl.style.transform="";
    setSheet(Math.abs(vel)>.45?vel<0:y<travel*.5);};
  grabEl.addEventListener("pointerup",endDrag);
  grabEl.addEventListener("pointercancel",endDrag);
  grabEl.addEventListener("click",()=>{if(!moved)setSheet(!railEl.classList.contains("open"));});
  if(sheetMQ&&sheetMQ.addEventListener)sheetMQ.addEventListener("change",()=>{railEl.style.transform="";setSheet(false);syncPeek();});
  syncPeek();
  addEventListener("resize",syncPeek);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(syncPeek).catch(()=>{});
}

  const j=id+"#j";pts[j]=best.q;link(adj,id,j);link(adj,j,best.a);link(adj,j,best.b);}

  attach(s,pts[s],adj,E2);attach(t,pts[t],adj,E2);
  if(adj[fromKey])link(adj,s,fromKey);if(adj[toKey])link(adj,toKey,t);
  const NT=new Set(["f:pool","f:spa","f:fitness","f:smoke2"]);

  for(;;){let u=null,bd=Infinity;for(const k in D) if(!done.has(k)&&D[k]<bd){bd=D[k];u=k;}

    const a=[nr/den,ni/den],aw=mul(a,wm),b=[zm[0]-aw[0],zm[1]-aw[1]],s=Math.hypot(a[0],a[1]);
    return {a,s,f:(lat,lng)=>{const q=mul(a,toW(lat,lng));return [q[0]+b[0],q[1]+b[1]];}};};

  const errOf=(F,L)=>L.map(p=>dist(F.f(p.lat,p.lng),[p.x,p.y])/F.s);

}

  const fit=GPSOK()?geoFit(gpsList()):null;
  WK={from:a,to:b,loop:a==="here"?(LOOPDEST.has(b)):isLoopTrip(a,b),path:null,cum:null,total:0,along:0,seg:1,snap:null,
      fit,mode:"gps",follow:true,offN:0,pos:null,acc:null,arrived:false,done:0,msg:"",msgKey:"",warn:false,fixes:0,watch:null};
  GT.zoomed=false;
  if(a!=="here")setPath(shortest(a,b,WK.loop).path);
  document.body.classList.add("walking");showPeek(null);
  if(!fit)toTap(GPSOK()?T("needsCheck"):T("notSetUp"));
  else if(!navigator.geolocation||!geoAllowedHere())toTap(T("locUnavailView"));
  else{WK.msg=T("findingLoc");
    const why=gtStart();
    if(why)toTap(T(why));
    else{WK.watch=true;
      /* the blue dot may already be live: use its latest fix straight away */
      if(GT.lastPos&&performance.now()-GT.lastT<15000)setTimeout(()=>{if(WK&&WK.watch)onFix(GT.lastPos,GT.tgt);},0);}}
  wakeOn();drawWalk();walkPanel();
  if(WK.path)fitTo(WK.path,50);else{const pb=pointOf(b);setView(pb[0]-200,pb[1]-150,400);}
  if(window.innerWidth<=860)$("wrap").scrollIntoView({block:"start",behavior:RM?"auto":"smooth"});
}
function setPath(path){WK.path=path;WK.cum=polyCum(path);WK.total=WK.cum[WK.cum.length-1];WK.along=0;WK.seg=1;WK.snap=null;}
function toTap(why){if(!WK)return;
  if(WK.watch){WK.watch=null;gtRelease();}
  WK.mode="tap";WK.warn=false;
  WK.msg=why+" "+(WK.path?T("tapWhereUpd"):T("tapWhereStart"));
  walkPanel();}
function onGeoErr(e){if(!WK||WK.mode!=="gps")return;
  if(e&&e.code===1)toTap(T("locBlocked"));
  else if(e&&e.code===3&&WK.fixes){WK.msg=T("gpsLost");WK.warn=true;walkPanel();}
  else if(e&&e.code===3)toTap(T("noSignal"));
  else{WK.msg=T("gpsUnavail");WK.warn=true;walkPanel();}}
function onFix(pos,p0){if(!WK||WK.arrived||WK.mode!=="gps")return;
  const c=pos.coords,p=p0||WK.fit.f(c.latitude,c.longitude);WK.fixes++;
  if(!inPoly(p,GEO.B)){const d=WK.path?onPath(p,WK.path,WK.cum).d*MPP:dist(p,pointOf(WK.to))*MPP;
    if(d>120){WK.msg=T("outside",{n:fmt(d)});WK.warn=true;walkPanel();return;}}
  walkAt(p,c.accuracy||0);}
function reroute(p){if(WK.path)WK.done+=WK.along;setPath(shortest("p:"+p[0].toFixed(1)+","+p[1].toFixed(1),WK.to,WK.loop).path);}
function walkAt(p,accM){const W=WK;if(!W||W.arrived)return;
  W.pos=p;W.acc=accM;W.warn=false;
  if(!W.path){reroute(p);W.msg=T("routePlanned");W.msgKey="planned";}
  let hit=onPath(p,W.path,W.cum);const offM=hit.d*MPP,tol=Math.max(20,Math.min(60,accM*0.8));
  if(offM>tol){W.offN++;
    if(W.offN>=2||W.mode==="tap"){reroute(p);hit=onPath(p,W.path,W.cum);W.offN=0;W.msg=T("leftRoute");W.msgKey="new";}
    else {W.msg=T("mayBeOff");W.msgKey="off";}}
  else{W.offN=0;if(!(W.msgKey==="planned"||W.msgKey==="new")||W.fixes%4===0){W.msg=W.mode==="gps"?T("followingPhone",{n:fmt(Math.max(3,accM))}):T("tapAgain");W.msgKey="follow";}}
  W.along=Math.max(0,hit.along);W.seg=hit.i;W.snap=hit.q;
  const rem=(W.total-W.along)*MPP,toDest=dist(p,pointOf(W.to))*MPP;

  drawWalk();walkPanel();
  /* in GPS mode the dot glides and the map pans with it (meFollow); a tap jumps */
  if(W.follow&&(W.mode!=="gps"||!GT.zoomed)){centerOn(p);GT.zoomed=true;}}
function arrive(){const W=WK;W.arrived=true;W.along=W.total;
  if(W.watch){W.watch=null;gtRelease();}meDraw();
  if(!GT.on)wakeOff();try{navigator.vibrate&&navigator.vibrate([120,80,120]);}catch(e){}
  W.msg="";drawWalk();walkPanel();const q=pointOf(W.to);centerOn(q);
  const kb=W.to.slice(2);if(AREAS[kb])flashAreas([kb],false);}
function centerOn(p){const w=Math.min(Math.max(vb.w,180),340);setView(p[0]-w/2,p[1]-w*H/W/2,w);}
function stopWalk(redraw){if(!WK)return;
  WK.watch=null;WK=null;gtRelease();meDraw();mePill();if(!GT.on)wakeOff();document.body.classList.remove("walking");$("walk").hidden=true;$("walk").innerHTML="";
  if(redraw)route(false);}
function drawWalk(){const W=WK,rl=$("routeLayer");rl.innerHTML="";if(!W)return;
  const D=pts=>pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const pb=pointOf(W.to);
  if(W.path){
    if(W.snap&&!W.arrived){const done=W.path.slice(0,W.seg).concat([W.snap]),left=[W.snap].concat(W.path.slice(W.seg));
      el("path",{d:D(done),fill:"none",stroke:"#8d958f","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.75},rl);
      el("path",{d:D(left),fill:"none",stroke:"#fff","stroke-width":9,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.9},rl);
      el("path",{d:D(left),fill:"none",stroke:"#e2552d","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},rl);
      if(!RM)el("path",{d:D(left),fill:"none",stroke:"#fff","stroke-width":2.2,"stroke-dasharray":"2 14","stroke-linecap":"round",class:"flow"},rl);}
    else{const d=D(W.path);
      el("path",{d,fill:"none",stroke:"#fff","stroke-width":9,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.9},rl);
      el("path",{d,fill:"none",stroke:W.arrived?"#1f8a4c":"#e2552d","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},rl);}}
  if(!RM&&!W.arrived)ring(pb,"#e2552d",rl);
  el("circle",{cx:pb[0],cy:pb[1],r:8,fill:W.arrived?"#1f8a4c":"#e2552d",stroke:"#fff","stroke-width":2.5},rl);
  if(W.pos&&!W.arrived){const p=W.pos;
    /* the blue dot itself lives in #meLayer so it can glide between GPS fixes */
    if(W.snap&&dist(p,W.snap)*MPP>5)el("line",{x1:p[0],y1:p[1],x2:W.snap[0],y2:W.snap[1],stroke:"#1a73e8","stroke-width":2,"stroke-dasharray":"4 4"},rl);}}
function walkPanel(){const W=WK,box=$("walk");if(!W){box.hidden=true;return;}
  const name=esc(nameOf(W.to)),rem=W.path?Math.max(0,(W.total-W.along)*MPP):null,tot=W.path?(W.done+W.total)*MPP:0,doneM=(W.done+W.along)*MPP;
  const pct=W.arrived?100:W.path&&W.total?Math.min(100,100*(W.done+W.along)/(W.done+W.total)):0;
  box.className="walk"+(W.arrived?" done":"");
  if(W.arrived){box.innerHTML=`<div class="top"><b>${esc(T("arrived"))}</b></div><div class="big">${name}</div><div class="bar"><i style="width:100%"></i></div>
    <p class="msg">${esc(T("walkedEnjoy",{n:fmt(tot)}))}</p><div class="acts"><button class="go" id="wkDone">${esc(T("done"))}</button></div>`;
    $("wkDone").onclick=()=>stopWalk(true);box.hidden=false;return;}
  box.innerHTML=`<div class="top"><b>${esc(T("walkingTo",{n:nameOf(W.to)}))}</b><button id="wkStop">${esc(T("end"))}</button></div>
    <div class="big">${rem==null?"–":fmt(rem)}<span>${esc(T("mToGo"))}</span></div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="meta">${rem==null?esc(T("waitingPos")):esc(T("aboutMinDone",{min:rem/75<1?"<1":Math.round(rem/75),a:fmt(doneM),b:fmt(tot)}))}</div>
    <p class="msg${W.warn?" warn":""}">${esc(W.msg)}</p>
    ${W.mode==="gps"?`<div class="acts"><button id="wkFollow" aria-pressed="${W.follow}">${esc(W.follow?T("following"):T("centerMe"))}</button></div>`:""}`;
  $("wkStop").onclick=()=>stopWalk(true);
  const fb=$("wkFollow");if(fb)fb.onclick=()=>{W.follow=true;if(W.pos)centerOn(W.pos);walkPanel();};
  box.hidden=false;}

/* ---------- live location: one GPS watch drives a blue dot that glides between fixes ---------- */
var GT={watch:null,on:false,follow:true,zoomed:false,fit:null,tgt:null,shown:null,acc:0,shownAcc:0,hd:null,prev:null,
  lastT:0,lastPos:null,bestT:0,bestAcc:1e9,anim:0,note:false,noteT:0};
const LIVE_URL=(u=>u.startsWith("__")?"":u)("https://jwee903-cmd.github.io/sibsan-map/");
function gtStart(){
  if(GT.watch!=null)return null;
  if(!GPSOK())return "notSetUp";
  const f=geoFit(gpsList());if(!f)return "needsCheck";
  if(!navigator.geolocation||!geoAllowedHere())return "locUnavailView";
  GT.fit=f;
  try{GT.watch=navigator.geolocation.watchPosition(gtFix,gtErr,{enableHighAccuracy:true,maximumAge:1000,timeout:30000});}
  catch(e){GT.watch=null;return "locUnavailView";}
  return null;}
function gtRelease(){
  if(GT.on||(WK&&WK.watch))return;
  if(GT.watch!=null){try{navigator.geolocation.clearWatch(GT.watch);}catch(e){}}
  cancelAnimationFrame(GT.anim);
  Object.assign(GT,{watch:null,shown:null,tgt:null,hd:null,prev:null,lastPos:null,lastT:0,bestT:0,bestAcc:1e9});}
function gtNorth(lat,lng){const a=GT.fit.f(lat,lng),b=GT.fit.f(lat+0.0002,lng);return Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;}
function gtFix(pos){
  const c=pos.coords,now=performance.now(),acc=c.accuracy||0;
  /* drop a wild reading when a much better one arrived moments ago */
  if(acc>100&&GT.bestAcc<acc/2&&now-GT.bestT<20000)return;
  if(acc<=GT.bestAcc||now-GT.bestT>20000){GT.bestAcc=acc;GT.bestT=now;}
  const p=GT.fit.f(c.latitude,c.longitude);
  if(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>0.6)GT.hd=c.heading+gtNorth(c.latitude,c.longitude);
  else if(GT.prev&&dist(p,GT.prev)*MPP>4)GT.hd=Math.atan2(p[0]-GT.prev[0],-(p[1]-GT.prev[1]))*180/Math.PI;
  if(!GT.prev||dist(p,GT.prev)*MPP>4)GT.prev=p;
  const gap=GT.lastT?now-GT.lastT:0;GT.lastT=now;GT.lastPos=pos;GT.acc=acc;
  if(GT.note){GT.note=false;clearTimeout(GT.noteT);} /* a fresh fix means any GPS warning is stale */
  meMove(p,acc,Math.min(1200,Math.max(350,gap*0.85)));
  if(WK&&WK.watch)onFix(pos,p);
  mePill();}
function gtErr(e){
  if(WK&&WK.watch)onGeoErr(e);
  if(!GT.on)return;
  if(e&&e.code===1){GT.on=false;gtRelease();meDraw();meBtn();mePill(T("locBlocked"));}
  else if(performance.now()-GT.lastT<15000)return; /* a brief hiccup between good fixes */
  else if(e&&e.code===3){if(!GT.shown)mePill(T("noSignal"));}
  else mePill(T("gpsUnavail"));}
/* glide the dot from where it is drawn to the new fix, so it moves like the guest walks */
function meMove(p,acc,ms){
  GT.tgt=p;cancelAnimationFrame(GT.anim);
  if(!GT.shown||RM||!ms||dist(p,GT.shown)*MPP>150){GT.shown=p.slice();GT.shownAcc=acc;meDraw();meFollow();return;}
  const from=GT.shown.slice(),fa=GT.shownAcc,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-(1-k)*(1-k);
    GT.shown=[from[0]+(p[0]-from[0])*e,from[1]+(p[1]-from[1])*e];GT.shownAcc=fa+(acc-fa)*e;
    meDraw();meFollow();if(k<1)GT.anim=requestAnimationFrame(step);};
  GT.anim=requestAnimationFrame(step);}
function meFollow(){if(!GT.shown)return;
  const f=WK?(WK.follow&&WK.mode==="gps"&&!WK.arrived&&WK.pos):(GT.on&&GT.follow);if(!f)return;
  if(!GT.zoomed){centerOn(GT.shown);GT.zoomed=true;return;}
  setView(GT.shown[0]-vb.w/2,GT.shown[1]-vb.h/2,vb.w);}
function meDraw(){const g=$("meLayer");if(!g)return;
  const show=GT.shown&&(GT.on||(WK&&WK.pos&&!WK.arrived));
  if(!show){g.innerHTML="";return;}
  if(!g.firstChild)g.innerHTML='<circle class="macc" fill="#1a73e8" fill-opacity=".13" stroke="#1a73e8" stroke-opacity=".4" stroke-width="1"/>'+
    '<g class="mdot"><path class="mcone" d="M0 0L-13 -29A32 32 0 0 1 13 -29Z" fill="url(#coneGrad)"/>'+
    (RM?"":'<circle r="8" fill="#1a73e8" opacity=".45" class="pulse"/>')+'<circle r="9.5" fill="#fff"/><circle r="6.8" fill="#1a73e8"/></g>';
  const r=svg.getBoundingClientRect(),s=Math.max(vb.w/(r.width||W),vb.h/(r.height||H));
  const x=GT.shown[0],y=GT.shown[1],ac=g.querySelector(".macc"),ar=GT.shownAcc/MPP;
  ac.setAttribute("cx",x.toFixed(2));ac.setAttribute("cy",y.toFixed(2));ac.setAttribute("r",Math.min(150,Math.max(0,ar)).toFixed(2));
  ac.style.display=ar>10*s?"":"none";
  g.querySelector(".mdot").setAttribute("transform",`translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(4)})`);
  const cone=g.querySelector(".mcone");
  if(GT.hd!=null&&GT.watch!=null){cone.style.display="";cone.setAttribute("transform",`rotate(${GT.hd.toFixed(1)})`);}
  else cone.style.display="none";}
function meWhere(){const p=GT.tgt||GT.shown;let best=null;
  /* small spots (smoking areas, bridge, entrance) only win when the guest is right on them */
  for(const k in GEO.F){const d=dist(p,GEO.F[k])*(/^smoke|^redbridge|^entrance/.test(k)?1.6:1);if(!best||d<best.d)best={k:"f:"+k,d};}
  for(const v in GEO.V){const d=dist(p,GEO.V[v]);if(d<best.d)best={k:"v:"+v,d};}
  if(!inPoly(p,GEO.B)&&best.d*MPP>40)return T("outsideResort");
  return best.d*MPP<=45?T("nearPlace",{name:nameOf(best.k)}):T("liveLoc");}
function mePill(note,link){const b=$("mePill");
  if(note){GT.note=true;clearTimeout(GT.noteT);GT.noteT=setTimeout(()=>{GT.note=false;mePill();},9000);
    b.className="mepill warn";
    b.innerHTML=`<span>${esc(note)}</span>`+(link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(T("openLive"))} →</a>`:"");
    b.hidden=false;return;}
  if(GT.note)return;
  if(!GT.on){b.hidden=true;return;}
  b.className="mepill";
  b.innerHTML=GT.shown?`<i></i><span>${esc(meWhere())}</span><small><bdi>${esc(T("accAbout",{n:Math.max(3,Math.round(GT.acc))}))}</bdi></small>`
    :`<i></i><span>${esc(T("findingLoc"))}</span>`;
  b.hidden=false;}
function meBtn(){const b=$("zme");b.setAttribute("aria-pressed",String(GT.on));b.classList.toggle("free",GT.on&&!GT.follow);}
$("zme").onclick=()=>{
  if(GT.on&&!GT.follow){GT.follow=true;GT.zoomed=false;meFollow();meBtn();return;}
  if(GT.on){GT.on=false;GT.note=false;clearTimeout(GT.noteT);gtRelease();meDraw();meBtn();mePill();if(!WK)wakeOff();return;}
  const why=gtStart();
  if(why){const blocked=why==="locUnavailView";mePill(blocked?T("meNeedsPage"):T(why),blocked&&LIVE_URL?LIVE_URL:null);return;}
  GT.on=true;GT.follow=true;GT.zoomed=false;GT.note=false;clearTimeout(GT.noteT);
  closeSheet();showPeek(null);meBtn();mePill();wakeOn();if(GT.shown){meDraw();meFollow();}};
$("mePill").onclick=e=>{if(GT.note||e.target.closest("a"))return;if(GT.on){GT.follow=true;GT.zoomed=false;meFollow();meBtn();}};

/* ---------- villa finder ---------- */
function clearVillaMarker(){$("measureLayer").querySelectorAll(".hl").forEach(n=>n.remove());}
function locate(v){
  v=String(v).trim();$("qerr").hidden=true;
  clearVillaMarker();
  if(!v){$("vcard").hidden=true;$("routeLayer").innerHTML="";$("result").innerHTML="";return;}
  if(!GEO.V[v]){$("qerr").textContent=T("noVilla",{v:v});$("qerr").hidden=false;$("vcard").hidden=true;return;}
  const p=GEO.V[v],fl=fromLobby("v:"+v);
  let near=null;for(const k of ["restaurant","pool","spa","fitness","cafe"]){const d=shortest("v:"+v,"f:"+k).len*MPP;if(!near||d<near.d)near={k,d};}
  let sm=null;for(const k of SMOKE){const d=shortest("v:"+v,"f:"+k).len*MPP;if(!sm||d<sm.d)sm={k,d};}
  $("vcard").innerHTML=`<h3>${esc(T("villa",{n:v}))}</h3><p>${esc(zone(v))}</p><p>${esc(T("fromLobbyWalk",{n:fmt(fl),min:Math.max(1,Math.round(fl/75))}))}</p><p>${esc(T("nearestVenue",{name:P(near.k).name,n:fmt(near.d)}))}</p><p>${esc(T("nearestSmoke",{n:fmt(sm.d)}))}</p>
   <div class="chips" style="margin-top:6px"><button class="chip" id="vFrom">${esc(T("routeFromLobby"))}</button><button class="chip" id="vSet">${esc(T("setAsStart"))}</button></div>`;
  $("vcard").hidden=false;
  $("vFrom").onclick=()=>{$("from").value="f:lobby";$("to").value="v:"+v;route(true);};
  $("vSet").onclick=()=>{$("from").value="v:"+v;route(true);};
  const g=el("g",{class:"hl"},$("measureLayer"));
  if(!RM){ring(p,"#e2552d",g);const r2=ring(p,"#e2552d",g);r2.style.animationDelay=".7s";}
  el("circle",{cx:p[0],cy:p[1],r:7,fill:"#e2552d",stroke:"#fff","stroke-width":2},g);
  el("text",{x:p[0]+11,y:p[1]-9,"font-size":15,"font-weight":700,fill:"#1f2a27",stroke:"#fff","stroke-width":4,"paint-order":"stroke","font-family":"Figtree,sans-serif"},g).textContent=v;
  setView(p[0]-110,p[1]-80,220);
}
$("findBtn").onclick=()=>{locate($("q").value);if(GEO.V[$("q").value.trim()])showPeek("v:"+$("q").value.trim());};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("findBtn").click();});

  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const w=Math.max(x1-x0,(y1-y0)*W/H);setView((x0+x1)/2-w/2,(y0+y1)/2-w*H/W/2,w);}

  const nw=Math.min(1500,Math.max(60,vb.w*f));const k=nw/vb.w;setView(p.x-(p.x-vb.x)*k,p.y-(p.y-vb.y)*k,nw);}

  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});

  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.d/d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;moved=99;return;}
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>4&&WK&&WK.follow){WK.follow=false;walkPanel();}
