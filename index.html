function addGps(k,lat,lng,acc){const i=AD.gps.findIndex(g=>g.k===k);const row={k,lat:+lat.toFixed(7),lng:+lng.toFixed(7)};if(acc)row.acc=Math.round(acc);
  if(i>=0)AD.gps[i]=row;else AD.gps.push(row);touchGps();
  $("gpsStatus").textContent=`${nameOf(k)} ${i>=0?"updated":"added"}. Press Save & publish to keep it.`;renderList();updateTop();drawGpsList();}
function drawGpsList(){const box=$("gpsList");if(!box)return;const list=gpsList(AD.gps),fit=geoFit(list);
  box.innerHTML=list.length?`<table class="gpstab"><thead><tr><th>Place</th><th>Latitude, longitude</th><th>${fit&&fit.rms!=null?"Fit error":""}</th><th></th></tr></thead><tbody>${list.map((g,j)=>`<tr><td>${esc(nameOf(g.k))}</td><td class="num">${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}${g.acc?` <span class="note">±${g.acc} m</span>`:""}</td><td class="num">${fit&&fit.rms!=null?fmt(fit.errs[j])+" m"+(fit.out&&fit.out[j]?` <span class="err" style="display:inline">· not used, check this pin</span>`:""):""}</td><td><button class="btn sm" data-gdel="${j}">Remove</button></td></tr>`).join("")}</tbody></table>`
   :`<p class="note">No places recorded yet.</p>`;
  box.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{AD.gps.splice(+b.dataset.gdel,1);touchGps();renderList();updateTop();drawGpsList();});
  const q=$("gpsQual");if(!q)return;
  if(!list.length){q.innerHTML=`<p class="okbox warn">Add one place to turn on live GPS walking.</p>`;return;}
  if(list.length===1){q.innerHTML=`<p class="okbox">Ready — quick setup. Guests' phones will show on the map, using this plan's north-up orientation and scale. Add a second place at least ${MIN_GPS_SPREAD} m away to measure the exact scale and angle instead of assuming them.</p>`;return;}
  if(!fit){q.innerHTML=`<p class="okbox warn">These places are too close together. Use places at least ${MIN_GPS_SPREAD} m apart, such as Main gate and River View Café.</p>`;return;}
  const off=fit.ratio<0.6||fit.ratio>1.6,bad=fit.rms!=null&&fit.rms>40;
  q.innerHTML=off?`<p class="okbox warn">The GPS distances don't match the map (GPS is ${Math.round(fit.ratio*100)}% of the map scale). One of the places is probably wrong. Check that each place matches its coordinates.</p>`
    :bad?`<p class="okbox warn">Live walking will work, but one place looks off by more than 40 m (see Fit error). Re-record that place or remove it.</p>`
    :`<p class="okbox">Ready. Guests' phones will show on the map${fit.rms!=null?`, typically within about ${fmt(Math.max(5,fit.rms))} m`:""}. ${list.length<3?"Adding a third place makes it more accurate.":""}${fit.out&&fit.out.some(Boolean)?` ${fit.out.filter(Boolean).length===1?"One pin is":fit.out.filter(Boolean).length+" pins are"} far off the others, so ${fit.out.filter(Boolean).length===1?"it is":"they are"} left out of the fit — re-drop ${fit.out.filter(Boolean).length===1?"it":"them"} on the centre of the building (marked below).`:""}</p>`;}
let gpsRec=null;
function recordHere(){const st=$("gpsStatus"),k=$("gpsK").value;
  if(gpsRec)return;
  if(!navigator.geolocation||!geoAllowedHere()){st.textContent="Location isn't available in this view. Paste the coordinates from Google Maps instead.";return;}
  let best=null,n=0;const t0=Date.now();st.textContent="Reading GPS… keep still.";$("gpsHere").disabled=true;
  const finish=msg=>{if(gpsRec){try{navigator.geolocation.clearWatch(gpsRec.w);}catch(e){}clearTimeout(gpsRec.t);}gpsRec=null;const b=$("gpsHere");if(b)b.disabled=false;
    if(best&&best.acc<=50)addGps(k,best.lat,best.lng,best.acc);else if($("gpsStatus"))$("gpsStatus").textContent=msg||(best?`GPS accuracy is only ±${fmt(best.acc)} m here. Move into the open and try again, or paste coordinates.`:"No GPS reading. Try again outdoors, or paste coordinates.");};
  try{const w=navigator.geolocation.watchPosition(pos=>{const c=pos.coords;n++;
      if(!best||c.accuracy<best.acc)best={lat:c.latitude,lng:c.longitude,acc:c.accuracy};
      if($("gpsStatus"))$("gpsStatus").textContent=`Reading GPS… best so far ±${fmt(best.acc)} m`;
      if((best.acc<=8&&n>=3)||Date.now()-t0>10000)finish();},
    e=>{finish(e&&e.code===1?"Location access is blocked in this view. Paste the coordinates from Google Maps instead.":null);},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
    gpsRec={w,t:setTimeout(()=>finish(),12000)};}
  catch(e){finish("Location isn't available in this view. Paste the coordinates from Google Maps instead.");}}
function renderPhotos(){const k=AD.sel,ph=AD.d[k].photos,box=$("adPhotos");if(!box)return;
  $("adPhotoCount").textContent=ph.length?`(${ph.length})`:"";
  box.innerHTML=ph.length?ph.map((p,j)=>`<div class="ephoto"><div class="ph"><img src="${esc(photoSrc(p))}" alt="" onerror="this.remove()">${j===0?'<span class="badge">Cover</span>':""}</div>
    <div class="pad"><input type="text" data-cap="${j}" id="ad-cap-${j}" placeholder="Caption (optional)" value="${esc(p.caption)}" aria-label="Caption for photo ${j+1}" autocomplete="off">
    <div class="acts"><button class="btn sm" data-mv="${j}:-1" ${j===0?"disabled":""} aria-label="Move photo ${j+1} earlier">‹</button><button class="btn sm" data-mv="${j}:1" ${j===ph.length-1?"disabled":""} aria-label="Move photo ${j+1} later">›</button><button class="btn sm" data-del="${j}">Remove</button></div></div></div>`).join("")
    :`<p class="note">No photos yet. Add some above and they appear here.</p>`;
  box.querySelectorAll("[data-cap]").forEach(i=>i.addEventListener("input",()=>{ph[+i.dataset.cap].caption=i.value.trim();touch(k);updateTop();renderList();}));
  box.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const[j,s]=b.dataset.mv.split(":").map(Number);const n=j+s;if(n<0||n>=ph.length)return;[ph[j],ph[n]]=[ph[n],ph[j]];touch(k);renderPhotos();renderList();updateTop();});
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ph.splice(+b.dataset.del,1);touch(k);renderPhotos();renderList();updateTop();});}
async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=url;});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(!blob)throw new Error("encode");return blob;}
  finally{URL.revokeObjectURL(url);}}
const toDataURL=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error("read"));fr.readAsDataURL(blob);});
function embeddedBytes(){let n=0;for(const k in AD.d)for(const p of AD.d[k].photos)if(p.src)n+=p.src.length;return n;}
async function uploadOne(f){
  if(ASSETS){const blob=await shrink(f,1800,.84);const r=await ASSETS.upload(blob,{type:"image/jpeg"});return {id:r.id,caption:""};}
  const blob=await shrink(f,1100,.74);const src=await toDataURL(blob);
  if(embeddedBytes()+src.length>13e6)throw {code:"too_large",message:"embedded limit"};
  return {src,caption:""};}
async function addFiles(files,k){
  const st=()=>$("adStatus");const say=m=>{if(AD.sel===k&&st())st().textContent=m;};
  files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name));
  if(!files.length){say("Choose image files (JPG, PNG or WebP).");return;}
  if(AD.busy){say("Wait for the current upload to finish.");return;}
  AD.busy=true;updateTop();let ok=0,bad=[],stop="";
  for(let i=0;i<files.length;i++){
    say(`Adding photo ${i+1} of ${files.length}…`);
    try{const p=await uploadOne(files[i]);AD.d[k].photos.push(p);ok++;touch(k);if(AD.sel===k)renderPhotos();renderList();updateTop();}
    catch(e){const c=e&&e.code;
      if(c==="rate_limited"||c==="quota_or_state"||c==="too_large"&&!ASSETS){stop=c;break;}
      bad.push(files[i].name);}}
  AD.busy=false;updateTop();loadUsage();
  let msg=ok?`${ok} photo${ok===1?"":"s"} added. Press Save & publish to keep ${ok===1?"it":"them"}.`:"No photos were added.";
  if(bad.length)msg+=` Could not read: ${bad.slice(0,3).join(", ")}${bad.length>3?"…":""}. Use JPG, PNG or WebP.`;
  if(stop==="rate_limited")msg+=" Uploading too fast; wait a moment and add the rest.";
  if(stop==="quota_or_state")msg+=" Photo storage for this page is full. Remove photos you no longer use.";
  if(stop==="too_large")msg+=" The page can't hold more photos in this view.";
  say(msg);}
function buildDoc(){
  let reset=null;for(const s of document.head.querySelectorAll("style")){if(s.id!=="css"&&s.textContent.includes("safe-area")&&s.textContent.length<2000){reset=s.textContent;break;}}
  if(!reset)reset=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  const json=JSON.stringify(STATE).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>Sib San Resort Map</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINK+'\n'
    +$("css").outerHTML+'\n'+$("shell").outerHTML+'\n<div id="root"></div>\n'+$("geo").outerHTML+'\n'+$("i18n").outerHTML
    +'\n<script type="application/json" id="state">'+json+'<\/script>\n'+$("main").outerHTML+'</body></html>';
}
async function saveAll(){
  const ks=[...AD.dirty];if(!ks.length||AD.busy)return;
  for(const k of ks){if(k==="__gps")continue;if(!AD.d[k].name.trim()){AD.sel=k;renderList();renderForm();banner("Every page needs a name before it can be saved.");return;}}
  if(!ART){banner("Saving isn't available in this view. Open the page in Claude as its owner.");return;}
  const before={};for(const k of ks){if(k==="__gps"){before[k]=STATE.gps;STATE.gps=clone(AD.gps);}else{before[k]=STATE.places[k];STATE.places[k]=canon(AD.d[k]);}}
  try{sessionStorage.setItem("sibsan-drafts",JSON.stringify(Object.fromEntries(ks.filter(k=>k!=="__gps").map(k=>[k,AD.d[k]]))));}catch(e){}
  AD.busy=true;updateTop();$("adSave").textContent="Publishing…";banner("");
  try{
    await ART.publish(buildDoc());
    for(const k of ks){AD.base[k]=k==="__gps"?JSON.stringify(STATE.gps):JSON.stringify(canon(STATE.places[k]));AD.dirty.delete(k);}
    banner(`Published ${ks.length} change${ks.length===1?"":"s"}. Guests see ${ks.length===1?"it":"them"} now.`);
    try{sessionStorage.removeItem("sibsan-drafts");}catch(e){}
    renderList();if(AD.sel&&$("adForm"))renderForm();
  }catch(e){
    for(const k of ks){if(k==="__gps"){if(before[k]===undefined)delete STATE.gps;else STATE.gps=before[k];}else STATE.places[k]=before[k];}const c=e&&e.code;
    banner(c==="conflict"?"Someone saved a newer version first. The page is reloading to it, and your edits will come back for you to save again."
      :(c==="not_writer"||c==="not_granted"||c==="consent_required")?"This view is read-only, so changes can't be saved."
      :c==="too_large"?"The page is too large to save. Remove some photos and try again."
      :c==="rate_limited"?"Saving too often. Wait a minute, then press Save again."
      :"Couldn't save just now. Check your connection and press Save again.");
    if(c==="not_writer"||c==="not_granted"){EDITOR=false;document.body.classList.remove("editor");}
  }
  AD.busy=false;$("adSave").textContent="Save & publish";updateTop();}
$("adSave").onclick=saveAll;
$("adBack").onclick=()=>{location.hash="map";};
$("manageBtn").onclick=()=>{location.hash="admin";};
$("adDiscard").onclick=()=>{
  if(!discardArm){$("adDiscard").textContent="Press again to discard";discardArm=setTimeout(()=>{discardArm=0;updateTop();},3500);return;}
  clearTimeout(discardArm);discardArm=0;const sel=AD.sel;initAD();AD.sel=sel;banner("Edits discarded.");renderAdmin();};

/* ---------- lightbox ---------- */
let lbI=0,lbSingle=false;
function lbPhotos(){return (P(current).photos)||[];}
function openLB(i){lbSingle=false;lbI=i;$("lb").hidden=false;drawLB();$("lbClose").focus();}
function openImageLB(src,caption){lbSingle=true;$("lb").hidden=false;
  $("lbImg").src=src;$("lbImg").alt=caption||"";$("lbCap").textContent=caption||"";
  $("lbCount").textContent="";$("lbPrev").hidden=true;$("lbNext").hidden=true;$("lbClose").focus();}
function drawLB(){if(lbSingle)return;const ph=lbPhotos();if(!ph.length){$("lb").hidden=true;return;}lbI=(lbI+ph.length)%ph.length;const p=ph[lbI];
  $("lbImg").src=photoSrc(p);$("lbImg").alt=p.caption||P(current).name;$("lbCap").textContent=p.caption||P(current).name;
  $("lbCount").textContent=`${lbI+1} / ${ph.length}`;$("lbPrev").hidden=$("lbNext").hidden=ph.length<2;}
$("lbClose").onclick=()=>{$("lb").hidden=true;lbSingle=false;};
$("lbPrev").onclick=()=>{if(lbSingle)return;lbI--;drawLB();};$("lbNext").onclick=()=>{if(lbSingle)return;lbI++;drawLB();};
$("lbStage").addEventListener("click",e=>{if(e.target===$("lbStage")){$("lb").hidden=true;lbSingle=false;}});
let sx=null;$("lbStage").addEventListener("pointerdown",e=>{sx=e.clientX;});
$("lbStage").addEventListener("pointerup",e=>{if(sx!=null&&!lbSingle&&Math.abs(e.clientX-sx)>50){lbI+=e.clientX<sx?1:-1;drawLB();}sx=null;});
document.addEventListener("keydown",e=>{
  if(!$("lb").hidden){if(e.key==="Escape"){$("lb").hidden=true;lbSingle=false;}else if(!lbSingle&&e.key==="ArrowRight"){lbI++;drawLB();}else if(!lbSingle&&e.key==="ArrowLeft"){lbI--;drawLB();}return;}
  if(!$("story").hidden&&e.key==="Escape"&&!editing)closeStory();});

(async()=>{try{
  if(!window.claude||!window.claude.use){return;}
